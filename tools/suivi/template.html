<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de formation</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1d2433; --muted: #6a7389; --line: #d9deea;
    --blue: #304870; --rose: #c187a1; --ok: #304870; --warn: #b7791f;
    --font: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b2030; --ink: #e8ebf4; --muted: #98a2bb; --line: #2b3347;
      --blue: #7f9ad0; --ok: #7f9ad0; --warn: #e0b04a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1b2030; --ink: #e8ebf4; --muted: #98a2bb; --line: #2b3347;
    --blue: #7f9ad0; --ok: #7f9ad0; --warn: #e0b04a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .ring { width: 84px; height: 84px; flex: none; }
  .ring text { font: 700 18px var(--font); fill: var(--ink); }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
           border: 1px solid var(--line); color: var(--muted); }
  .badge.demo { color: var(--warn); border-color: var(--warn); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #snake { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  #snake svg { position: absolute; inset: 0; pointer-events: none; }
  .node { position: absolute; width: 96px; margin-left: -48px; text-align: center; background: none; border: 0;
          cursor: pointer; font: inherit; color: var(--ink); padding: 0; }
  .node .dot { width: 46px; height: 46px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center;
               font-weight: 700; border: 2px solid var(--line); background: var(--card); color: var(--muted); }
  .node .lbl { font-size: 11.5px; line-height: 1.25; color: var(--muted); display: block; }
  .node:hover .dot, .node:focus-visible .dot { border-color: var(--rose); outline: none; }
  .node.sel .lbl { color: var(--ink); font-weight: 600; }
  .node.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .node.current .dot { background: var(--rose); border-color: var(--rose); color: #fff; animation: pulse 2s infinite; }
  .node.skipped .dot { border-style: dashed; border-color: var(--warn); color: var(--warn); }
  .node.optional .dot { border-style: dotted; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(193,135,161,.55); } 70% { box-shadow: 0 0 0 12px rgba(193,135,161,0); } 100% { box-shadow: 0 0 0 0 rgba(193,135,161,0); } }
  @media (prefers-reduced-motion: reduce) { .node.current .dot { animation: none; } }
  /* Détail d'un module : tiroir à droite (plein écran sur petit écran), sans défilement de la page. */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 11; display: flex; flex-direction: column; overflow: hidden;
           background: var(--card); border-left: 1px solid var(--line); padding: 0;
           box-shadow: -8px 0 24px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .22s ease; }
  #panel.open { transform: none; }
  /* Poignée de tiroir : ‹ pour ouvrir (bord de l'écran), › pour fermer (bord du tiroir). */
  #pull { position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 12; width: 28px; height: 64px;
          border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; background: var(--card); color: var(--ink);
          font-size: 22px; line-height: 1; cursor: pointer; box-shadow: -4px 0 12px rgba(0,0,0,.12); transition: right .22s ease; }
  #pull.open { right: min(560px, 100%); }
  #pull:hover { border-color: var(--rose); }
  @media (max-width: 560px) { #pull.open { display: none; } }
  @media (prefers-reduced-motion: reduce) { #pull { transition: none; } }
  @media (prefers-reduced-motion: reduce) { #panel, #backdrop { transition: none; } }
  /* En-tête rose fixe : module + workflow + récap. Corps défilant. Pied fixe : la fiche. */
  #panel .hd { flex: none; position: relative; background: var(--card); color: var(--ink); padding: 16px 22px 14px; border-bottom: 3px solid var(--rose); }
  #panel .hd h2 { margin: 0 44px 2px 0; font-size: 18px; color: var(--ink); }
  #panel .hd .meta { color: var(--muted); margin: 0 0 10px; }
  #panel .close { position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; border-radius: 50%;
                  border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; }
  #panel .close:hover { border-color: var(--rose); }
  #panel .flow { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  #panel .flow span { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  #panel .recap { background: var(--bg); border-left: 3px solid var(--rose); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 13.5px; }
  #panel .recap p { margin: 2px 0 0; }
  #panel .recap code { background: var(--card); }
  #panel .bd { flex: 1; overflow-y: auto; padding: 6px 22px 18px; }
  #panel .blk { margin: 12px 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
  #panel .blk .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  #panel .blk.k-exercice { border: 2px solid var(--rose); background: var(--card); }
  #panel .blk.k-exercice .tag { color: var(--rose); }
  #panel .blk.k-verification .tag { color: var(--blue); }
  #panel .blk p { margin: 4px 0; }
  #panel details { margin-top: 14px; }
  #panel summary { cursor: pointer; font-weight: 600; color: var(--blue); }
  #panel .ft { flex: none; display: flex; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--card); }
  #panel .ft a { flex: 1; text-align: center; padding: 10px 14px; border-radius: 10px; background: var(--blue); color: var(--card); font-weight: 600; text-decoration: none; }
  #panel .ft .nav { width: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
  #panel .ft .nav:hover:not(:disabled) { border-color: var(--rose); }
  #panel .ft .nav:disabled { opacity: .3; cursor: default; }
  #panel .ft a:hover { filter: brightness(1.12); }
  #panel h2 { margin: 0 0 4px; font-size: 18px; }
  #panel h3 { margin: 18px 0 4px; font-size: 14px; color: var(--blue); }
  #panel .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #panel code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  #panel pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  #panel pre code { border: 0; padding: 0; }
  #panel blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--rose); background: var(--bg); border-radius: 0 6px 6px 0; }
  #panel p { margin: 6px 0; }
  .notes { margin-top: 14px; color: var(--muted); font-size: 13px; }
  .theme { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="ring" viewBox="0 0 84 84" aria-hidden="true">
      <circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle id="ringArc" cx="42" cy="42" r="36" fill="none" stroke="var(--rose)" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="0 226" transform="rotate(-90 42 42)"/>
      <text id="ringTxt" x="42" y="48" text-anchor="middle">0%</text>
    </svg>
    <div>
      <h1 id="title">Suivi de formation</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="theme" id="theme" type="button">Thème</button>
  </header>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>Fait</span>
    <span><i style="background:var(--rose)"></i>En cours</span>
    <span><i style="border:2px dashed var(--warn)"></i>Sauté</span>
    <span><i style="border:2px dotted var(--muted)"></i>Optionnel</span>
    <span><i style="border:2px solid var(--line)"></i>À faire</span>
  </div>
  <div id="snake" role="list" aria-label="Parcours de formation"></div>
  <div id="backdrop"></div>
  <section id="panel" aria-live="polite" aria-label="Détail du module"></section>
  <button id="pull" type="button" aria-label="Ouvrir le détail du module" title="Ouvrir / fermer le détail">‹</button>
  <div class="notes" id="notes"></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var mods = D.modules.filter(function (m) { return m.path[D.profil] !== "out"; });
  var cur = String(D.etape).split(".")[0].padStart(2, "0");
  /* Dans un onglet VS Code, suit le thème de l'éditeur. */
  var bc = document.body.classList;
  if (bc.contains("vscode-dark") || bc.contains("vscode-high-contrast")) document.documentElement.setAttribute("data-theme", "dark");
  else if (bc.contains("vscode-light")) document.documentElement.setAttribute("data-theme", "light");

  function state(m) {
    if (D.faits[m.num]) return "done";
    if (D.sautes.indexOf(m.num) >= 0) return "skipped";
    if (m.num === cur) return "current";
    if (m.path[D.profil] === "optional") return "optional";
    return "todo";
  }
  var LABEL = { done: "Fait", current: "En cours", skipped: "Sauté", optional: "Optionnel", todo: "À faire" };

  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function md(src) {
    var out = "", para = [], code = null, list = false;
    function flush() { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } }
    function closeList() { if (list) { out += "</ul>"; list = false; } }
    src.split("\n").forEach(function (line) {
      if (code !== null) {
        if (/^```/.test(line)) { out += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; code = null; }
        else code.push(line);
        return;
      }
      if (/^```/.test(line)) { flush(); closeList(); code = []; return; }
      if (!line.trim()) { flush(); closeList(); return; }
      if (/^>\s?/.test(line)) { flush(); closeList(); out += "<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>"; return; }
      if (/^- /.test(line)) { flush(); if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(line.slice(2)) + "</li>"; return; }
      para.push(line.trim());
    });
    flush(); closeList();
    return out;
  }

  /* En-tête : anneau de progression et temps restant. */
  var core = mods.filter(function (m) { return m.path[D.profil] === "in"; });
  var done = core.filter(function (m) { return D.faits[m.num]; }).length;
  var pct = core.length ? Math.round((done / core.length) * 100) : 0;
  var left = core.filter(function (m) { return !D.faits[m.num] && D.sautes.indexOf(m.num) < 0; })
                 .reduce(function (a, m) { return a + (m.minutes[D.profil] || 0); }, 0);
  document.getElementById("ringArc").setAttribute("stroke-dasharray", (226 * pct / 100) + " 226");
  document.getElementById("ringTxt").textContent = pct + "%";
  document.getElementById("title").textContent = D.demo ? "Aperçu du parcours" : "Parcours de " + D.prenom;
  var h = Math.floor(left / 60), mn = left % 60;
  document.getElementById("sub").innerHTML =
    "Profil <strong>" + esc(D.profil) + "</strong> · " + done + "/" + core.length + " modules faits · ≈ " +
    (h ? h + " h " : "") + (mn ? mn + " min" : (h ? "" : "0 min")) + " restantes" +
    (D.demo ? ' <span class="badge demo">aucune progression</span>' : "");

  /* Serpent : les lignes alternent de sens, le tracé relie les centres. */
  var snake = document.getElementById("snake"), sel = null;
  var CELL_H = 112, PAD_Y = 30;
  function layout() {
    var w = snake.clientWidth, cols = w < 520 ? 3 : w < 820 ? 4 : 6;
    var cellW = w / cols, rowsN = Math.ceil(mods.length / cols);
    snake.style.height = (rowsN * CELL_H + PAD_Y) + "px";
    var pts = [];
    mods.forEach(function (m, i) {
      var r = Math.floor(i / cols), c = r % 2 === 0 ? i % cols : cols - 1 - (i % cols);
      var x = cellW * c + cellW / 2, y = PAD_Y / 2 + r * CELL_H + 23;
      pts.push([x, y]);
      var el = snake.querySelector('[data-num="' + m.num + '"]');
      el.style.left = x + "px"; el.style.top = (y - 23) + "px";
    });
    var curIdx = -1;
    mods.forEach(function (m, i) { var s = state(m); if (s === "done" || s === "current") curIdx = i; });
    function poly(list) { return list.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" "); }
    var svg = snake.querySelector("svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + (rowsN * CELL_H + PAD_Y));
    svg.innerHTML = '<path d="' + poly(pts) + '" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
      (curIdx > 0 ? '<path d="' + poly(pts.slice(0, curIdx + 1)) + '" fill="none" stroke="var(--rose)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' : "");
  }

  snake.innerHTML = '<svg aria-hidden="true"></svg>' + mods.map(function (m) {
    var s = state(m);
    return '<button type="button" class="node ' + s + '" data-num="' + m.num + '" role="listitem" aria-label="Module ' + m.num + ' : ' + esc(m.title) + ', ' + LABEL[s] + '">' +
      '<span class="dot">' + (s === "done" ? "✓" : m.num) + '</span><span class="lbl">' + esc(m.title) + '</span></button>';
  }).join("");

  var FICHE = "https://training.harington.fr/formation/fiche_prise_en_main_claude.html";
  var FLOW = ["Concept", "Cas concret", "Exercice", "Vérification", "À retenir"];
  var KIND = { "Cas concret": "cas", "Exercice": "exercice", "Vérification": "verification", "Si ça bloque": "blocage", "Fichier clé": "fichier" };
  /* Découpe le texte d'un pas en blocs étiquetés (cas concret, exercice, vérification, fichier clé). */
  function steps(src) {
    var blocks = [], cur = null;
    src.split("\n").forEach(function (line) {
      var m = line.match(/^\*\*(Cas concret|Exercice|Vérification|Si ça bloque)[^*]*\*\*\s*:\s*(.*)$/);
      var f = /^Fichiers? (clés?|à ouvrir)/.test(line);
      if (m || f) { cur = { kind: m ? m[1] : "Fichier clé", body: [m ? m[2] : line] }; blocks.push(cur); }
      else if (cur) cur.body.push(line);
      else { cur = { kind: "", body: [line] }; blocks.push(cur); }
    });
    return blocks.map(function (b) {
      var inner = md(b.body.join("\n"));
      if (!inner) return "";
      return b.kind ? '<div class="blk k-' + KIND[b.kind] + '"><div class="tag">' + b.kind + "</div>" + inner + "</div>" : inner;
    }).join("");
  }
  function show(num) {
    var m = mods.filter(function (x) { return x.num === num; })[0];
    if (!m) return;
    sel = num;
    Array.prototype.forEach.call(snake.querySelectorAll(".node"), function (n) { n.classList.toggle("sel", n.dataset.num === num); });
    var hd = '<div class="hd"><button type="button" class="close" aria-label="Fermer le détail">›</button>' +
      '<h2>Module ' + m.num + ' — ' + esc(m.title) + '</h2><div class="meta">' + LABEL[state(m)] +
      (m.fiche ? ' · ' + esc(m.fiche) : '') + (m.minutes ? ' · ~' + m.minutes[D.profil] + ' min' : '') + '</div>' +
      '<div class="flow">' + FLOW.map(function (f) { return "<span>" + f + "</span>"; }).join("") + '</div>' +
      (m.retenir ? '<div class="recap"><strong>À retenir</strong>' + md(m.retenir) + '</div>' : '') + '</div>';
    var bd = "";
    if (m.concept) bd += '<h3>Concept</h3>' + md(m.concept);
    (m.steps || []).forEach(function (s) { bd += '<h3>Pas ' + s.k + '/' + s.m + ' — ' + esc(s.title) + '</h3>' + steps(s.md); });
    if (m.question) bd += '<details><summary>Question de contrôle</summary>' + md(m.question) + '</details>';
    var i = mods.indexOf(m), prev = mods[i - 1], next = mods[i + 1];
    var ft = '<div class="ft">' +
      '<button type="button" class="nav" data-go="' + (prev ? prev.num : "") + '"' + (prev ? "" : " disabled") + ' aria-label="Module précédent" title="Module précédent">‹</button>' +
      '<a href="' + FICHE + '" target="_blank" rel="noopener">📖 Ouvrir la fiche' + (m.fiche ? ' — ' + esc(m.fiche) : '') + '</a>' +
      '<button type="button" class="nav" data-go="' + (next ? next.num : "") + '"' + (next ? "" : " disabled") + ' aria-label="Module suivant" title="Module suivant">›</button></div>';
    var panel = document.getElementById("panel");
    panel.innerHTML = hd + '<div class="bd">' + bd + '</div>' + ft;
    panel.querySelector(".bd").scrollTop = 0;
    panel.classList.add("open");
    document.getElementById("backdrop").classList.add("open");
    var pull = document.getElementById("pull");
    pull.classList.add("open"); pull.textContent = "›"; pull.setAttribute("aria-label", "Fermer le détail du module");
  }
  function closePanel() {
    document.getElementById("panel").classList.remove("open");
    document.getElementById("backdrop").classList.remove("open");
    Array.prototype.forEach.call(snake.querySelectorAll(".node"), function (n) { n.classList.remove("sel"); });
    var pull = document.getElementById("pull");
    pull.classList.remove("open"); pull.textContent = "‹"; pull.setAttribute("aria-label", "Ouvrir le détail du module");
  }
  /* La poignée ouvre le dernier module consulté, sinon le module en cours, sinon le premier. */
  document.getElementById("pull").addEventListener("click", function () {
    if (document.getElementById("panel").classList.contains("open")) { closePanel(); return; }
    var has = function (n) { return mods.some(function (m) { return m.num === n; }); };
    show(sel && has(sel) ? sel : has(cur) ? cur : mods[0].num);
  });
  document.getElementById("panel").addEventListener("click", function (e) {
    if (e.target.closest(".close")) { closePanel(); return; }
    var nav = e.target.closest(".nav");
    if (nav && nav.dataset.go) show(nav.dataset.go);
  });
  document.getElementById("backdrop").addEventListener("click", closePanel);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closePanel(); return; }
    if (!document.getElementById("panel").classList.contains("open")) return;
    var b = document.querySelector('#panel .nav[aria-label="' + (e.key === "ArrowLeft" ? "Module précédent" : "Module suivant") + '"]');
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && b && b.dataset.go) show(b.dataset.go);
  });
  snake.addEventListener("click", function (e) {
    var n = e.target.closest(".node");
    if (n) show(n.dataset.num);
  });

  document.getElementById("notes").textContent = D.notes.length ? "Notes du tuteur : " + D.notes.join(" · ") : "";
  var t = document.getElementById("theme");
  t.addEventListener("click", function () {
    var root = document.documentElement, dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#12151c";
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  window.addEventListener("resize", layout);
  layout();
})();
</script>
</body>
</html>
